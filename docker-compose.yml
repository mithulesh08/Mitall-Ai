version: '3.8'

services:
  mitall-web-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitall_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  mitall-fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitall_fastapi
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
